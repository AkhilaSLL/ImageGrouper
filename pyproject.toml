[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imggroup"
version = "2.2.0"
description = "Group images into albums by what is in them, and reorganise them into one folder."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AkhilaSLL" }]
keywords = ["images", "clustering", "embeddings", "dinov2", "onnx", "tkinter"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=7.0"]

[project.gui-scripts]
imggroup = "imggroup:main"

[project.urls]
Homepage = "https://github.com/AkhilaSLL/ImageGrouper"
Issues = "https://github.com/AkhilaSLL/ImageGrouper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests", "scripts"]

[tool.pyright]
# Without these, every `import numpy` / `from PIL import ...` and every
# `from imggroup...` shows up as an unresolved-import squiggle in the editor.
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts", "run.py"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportMissingModuleSource = "none"
